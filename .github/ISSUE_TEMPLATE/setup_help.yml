name: Setup help
description: Ask for help installing or configuring the plugin
title: "help: "
labels:
  - question
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Never paste an API key. Redact account identifiers, private paths, and private endpoints.
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin version, Hermes version, operating system, and Python version
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Global / Singapore
        - China / Beijing
        - Both
        - Not sure
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include redacted commands and errors, plus what has not been tested.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, account identifiers, private endpoints, and private paths.
          required: true
