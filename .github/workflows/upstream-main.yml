name: upstream Hermes drift

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-hermes-main
  cancel-in-progress: true

jobs:
  current-main:
    name: Current Hermes main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out current Hermes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install Hermes and test dependencies
        run: python -m pip install -e ./hermes-agent -r requirements-dev.txt
      - name: Run discovery and runtime integration test
        env:
          HERMES_AGENT_REPO: ${{ github.workspace }}/hermes-agent
        run: python -m pytest tests/test_current_hermes_integration.py -q
