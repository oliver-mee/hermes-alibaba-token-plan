name: upstream Hermes drift

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-hermes-main
  cancel-in-progress: true

jobs:
  current-main:
    name: Current Hermes main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out current Hermes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Hermes and test dependencies
        # Hermes imports ruamel.yaml on every Python but only declares it for
        # 3.14+ (NousResearch/hermes-agent#122536). Drop once that merges.
        run: python -m pip install -e ./hermes-agent -r requirements-dev.txt ruamel.yaml rich requests python-dotenv "websockets>=14,<17"
      - name: Run discovery and runtime integration test
        env:
          HERMES_AGENT_REPO: ${{ github.workspace }}/hermes-agent
        run: python -m pytest -q --ignore=tests/test_native_package.py
