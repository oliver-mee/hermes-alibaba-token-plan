name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  standalone:
    name: Standalone plugin tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest==9.1.1
      - name: Run standalone contract tests
        run: python -m pytest tests/test_profiles.py -q
      - name: Exercise installer in a temporary Hermes home
        run: |
          hermes_home="$(mktemp -d)"
          trap 'rm -rf "$hermes_home"' EXIT
          HERMES_HOME="$hermes_home" ./install.sh
          HERMES_HOME="$hermes_home" ./install.sh --verify
          HERMES_HOME="$hermes_home" ./install.sh --uninstall
          test ! -e "$hermes_home/plugins/model-providers/alibaba-token-plan"
          test ! -e "$hermes_home/plugins/model-providers/alibaba-token-plan-cn"
          unsafe_home="$(mktemp -d)"
          outside="$(mktemp -d)"
          mkdir -p "$unsafe_home/plugins"
          ln -s "$outside" "$unsafe_home/plugins/model-providers"
          if HERMES_HOME="$unsafe_home" ./install.sh; then
            echo "installer unexpectedly followed a symlinked plugin destination" >&2
            exit 1
          fi

  current-hermes-integration:
    name: Current Hermes integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check out current Hermes
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Hermes and test dependencies
        run: python -m pip install -e ./hermes-agent pytest==9.1.1
      - name: Run real discovery integration test
        env:
          HERMES_AGENT_REPO: ${{ github.workspace }}/hermes-agent
        run: python -m pytest tests/test_current_hermes_integration.py -q
